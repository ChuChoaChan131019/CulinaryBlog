events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  client_max_body_size 10M;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  # Khớp giới hạn SRS (CLAUDE.md): auth 10 req/phút/IP, API chung 100 req/phút/IP.
  limit_req_zone $binary_remote_addr zone=api_auth:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=api_general:10m rate=100r/m;
  limit_req_status 429;

  upstream backend  { server backend:5000; }
  upstream frontend { server frontend:3000; }

  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    server_name _;

    # ponytail: chứng chỉ self-signed sinh tự động khi container khởi động (xem
    # nginx/docker-entrypoint.sh), đủ cho local/CI. Thay bằng chứng chỉ CA thật
    # (Let's Encrypt/cert-manager) khi deploy production.
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";

    location /api/v1/auth/ {
      limit_req zone=api_auth burst=5 nodelay;
      proxy_pass http://backend;
      proxy_read_timeout 120s;
    }

    location /api/ {
      limit_req zone=api_general burst=20 nodelay;
      proxy_pass http://backend;
      proxy_read_timeout 120s;
    }

    location / {
      proxy_pass http://frontend;
    }
  }
}
