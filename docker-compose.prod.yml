# Overlay thêm backend/frontend/nginx đóng container (build multi-stage, chạy production build) lên
# trên hạ tầng của docker-compose.yml. Chạy cùng base: `pnpm docker:prod:up`
# (= docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build).
#
# backend/frontend chạy trong network nội bộ của compose nên nối tới postgres/redis/minio qua tên
# service (không phải localhost như khi chạy `pnpm dev` ở host) — 3 biến DATABASE_URL/REDIS_URL/
# S3_ENDPOINT khai báo ở environment dưới đây override lại giá trị localhost mặc định trong .env,
# các biến còn lại (JWT, Google OAuth...) vẫn lấy từ .env qua env_file.
services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    expose:
      - '5000'
    ports:
      - '${BACKEND_PORT:-5000}:5000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      # node:22-alpine không có curl/wget — probe bằng http module của Node.
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:5000/api/v1/health/live',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        # Chạy sau Nginx (SSL termination ở service nginx dưới) -> luôn https://localhost, không
        # đọc NEXT_PUBLIC_API_URL của .env (giá trị đó dành cho dev chạy frontend trực tiếp ở host).
        NEXT_PUBLIC_API_URL: https://localhost/api
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      AUTH_URL: https://localhost
      # Server Components gọi API bằng mạng nội bộ Compose; trình duyệt vẫn dùng
      # NEXT_PUBLIC_API_URL được build thành https://localhost/api.
      API_URL: http://backend:5000/api
    expose:
      - '3000'
    ports:
      - '${FRONTEND_PORT:-3000}:3000'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  nginx:
    build:
      context: ./nginx
    restart: unless-stopped
    ports:
      - '${NGINX_PORT:-80}:80'
      - '${NGINX_SSL_PORT:-443}:443'
    volumes:
      - nginx-certs:/etc/nginx/certs
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

volumes:
  nginx-certs:
